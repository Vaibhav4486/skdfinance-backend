spring.application.name=skd-finance-backend

# ---- Datasource ----
# Local default is preserved.
# Render will override this using SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skd_finance?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
# Local: 8080
# Render: uses Render's PORT automatically
server.port=${PORT:8080}

# ---- JWT ----
jwt.secret=${JWT_SECRET:local-development-secret-change-this}
jwt.expiration-ms=86400000

# ---- Bootstrap admin account ----
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:22761a05e8@lbrce.ac.in}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:ChangeThisPassword123!}
admin.bootstrap.full-name=${ADMIN_BOOTSTRAP_FULL_NAME:Vaibhav}

# ---- Email (Resend HTTP API — NOT SMTP) ----
# Render blocks outbound SMTP entirely (confirmed by the "Connection timed out"
# error on smtp.gmail.com:587), so this sends over regular HTTPS instead.
# Get your key at https://resend.com — sign up using the SAME email as
# NOTIFICATION_ADMIN_EMAIL below, since free-tier Resend can only send TO the
# address you signed up with until you verify a domain.
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:onboarding@resend.dev}

# ---- New-lead notification email ----
notification.admin-email=${NOTIFICATION_ADMIN_EMAIL:22761a05e8@lbrce.ac.in}