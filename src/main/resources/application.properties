spring.application.name=skd-finance-backend

# ---- Datasource ----
# Local default is preserved.
# Render will override this using SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skd_finance?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
# Local: 8080
# Render: uses Render's PORT automatically
server.port=${PORT:8080}

# ---- JWT ----
jwt.secret=${JWT_SECRET:local-development-secret-change-this}
jwt.expiration-ms=86400000

# ---- Bootstrap admin account ----
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:22761a05e8@lbrce.ac.in}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:ChangeThisPassword123!}
admin.bootstrap.full-name=${ADMIN_BOOTSTRAP_FULL_NAME:Vaibhav}

# ---- Email (Gmail SMTP) ----
# ---- Email (Resend SMTP) ----
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# ---- New-lead notification email ----
notification.admin-email=${NOTIFICATION_ADMIN_EMAIL:22761a05e8@lbrce.ac.in}